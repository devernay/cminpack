name: Install cminpack on Ubuntu through CMake
run-name: Build, test and install cminpack on Ubuntu through CMake
on: [push, pull_request]

jobs:
  cminpack-ubuntu:
    name: cminpack (GCC toolchain + CMake)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        BUILD_SHARED_LIBS: [ 'ON' , 'OFF' ]
        CMAKE_BUILD_TYPE: [ 'Release', 'Debug', 'RelWithDebInfo', 'MinSizeRel' ]
        CMINPACK_PRECISION: [ 'd' ] # seems to be the only precision that the current tests reference work
        USE_BLAS: [ 'OFF' ]
        USE_LAPACK: [ 'OFF' ]
        BUILD_EXAMPLES_FORTRAN: [ 'OFF' ]
        include:
          - BUILD_SHARED_LIBS: 'ON'
            CMAKE_BUILD_TYPE: 'RelWithDebInfo'
            CMINPACK_PRECISION: 'd'
            USE_BLAS: 'ON'
            USE_LAPACK: 'OFF'
            BUILD_EXAMPLES_FORTRAN: 'OFF'
          - BUILD_SHARED_LIBS: 'ON'
            CMAKE_BUILD_TYPE: 'RelWithDebInfo'
            CMINPACK_PRECISION: 'd'
            USE_BLAS: 'ON'
            USE_LAPACK: 'ON'
            BUILD_EXAMPLES_FORTRAN: 'OFF'
          - BUILD_SHARED_LIBS: 'ON'
            CMAKE_BUILD_TYPE: 'RelWithDebInfo'
            CMINPACK_PRECISION: 'd'
            USE_BLAS: 'OFF'
            USE_LAPACK: 'OFF'
            BUILD_EXAMPLES_FORTRAN: 'ON'
          - BUILD_SHARED_LIBS: 'OFF'
            CMAKE_BUILD_TYPE: 'Release'
            CMINPACK_PRECISION: 'all'
            USE_BLAS: 'OFF'
            USE_LAPACK: 'OFF'
            BUILD_EXAMPLES_FORTRAN: 'OFF'
            CMAKE_UNITY_BUILD: 'ON'
    
    env:
      CMINPACK_BUILD_DIR: $RUNNER_TEMP/cminpack-build-shared-libs-${{ matrix.BUILD_SHARED_LIBS }}-build-type-${{ matrix.CMAKE_BUILD_TYPE }}-precision-${{ matrix.CMINPACK_PRECISION }}
      CMINPACK_INSTALL_DIR: $RUNNER_TEMP/cminpack-install-shared-libs-${{ matrix.BUILD_SHARED_LIBS }}-build-type-${{ matrix.CMAKE_BUILD_TYPE }}-precision-${{ matrix.CMINPACK_PRECISION }}
    
    steps:
      - name: Install BLAS
        run: sudo apt-get install -y libopenblas-dev
        if: ${{ matrix.USE_BLAS == 'ON' }}
      
      - name: Install LAPACK
        run: sudo apt-get install -y liblapack-dev
        if: ${{ matrix.USE_LAPACK == 'ON' }}
      
      - name: Install FORTRAN compiler
        run: sudo apt-get install -y gfortran
        if: ${{ matrix.BUILD_EXAMPLES_FORTRAN == 'ON' }}
      
      - name: Checkout repository to cminpack directory
        uses: actions/checkout@v4
        with:
          path: cminpack
      
      - name: Check that an invalid CMINPACK_PRECISION is rejected
        run: "! cmake -DCMINPACK_PRECISION=double -S cminpack -B $RUNNER_TEMP/bad-precision 2> err.txt && grep 'must be one of' err.txt"
      
      - name: Configure cminpack build
        run: cmake -G "Unix Makefiles" -DBUILD_SHARED_LIBS=${{ matrix.BUILD_SHARED_LIBS }} -DCMAKE_BUILD_TYPE=${{ matrix.CMAKE_BUILD_TYPE }} -DCMINPACK_PRECISION=${{ matrix.CMINPACK_PRECISION }} -DUSE_BLAS=${{ matrix.USE_BLAS }} -DUSE_LAPACK=${{ matrix.USE_LAPACK }} -DCMAKE_C_FLAGS=${{ matrix.USE_LAPACK == 'ON' && '-Werror=comment' || '' }} -DBUILD_EXAMPLES_FORTRAN=${{ matrix.BUILD_EXAMPLES_FORTRAN }} -DCMAKE_UNITY_BUILD=${{ matrix.CMAKE_UNITY_BUILD || 'OFF' }} --install-prefix ${{ env.CMINPACK_INSTALL_DIR }} -S cminpack -B ${{ env.CMINPACK_BUILD_DIR }}
      
      - name: Check that an empty CMAKE_BUILD_TYPE is accepted
        run: cmake -DCMAKE_BUILD_TYPE= -S cminpack -B $RUNNER_TEMP/empty-build-type
      
      - name: Build cminpack
        run: cmake --build ${{ env.CMINPACK_BUILD_DIR }} --config ${{ matrix.CMAKE_BUILD_TYPE }}
      
      - name: Check that make clean removes the object files
        run: make -C cminpack/examples ssqfcn.o && make -C cminpack/examples clean && ! ls cminpack/examples/*.o
      
      - name: Test cminpack
        run: ctest --test-dir ${{ env.CMINPACK_BUILD_DIR }} --build-config ${{ matrix.CMAKE_BUILD_TYPE }} --output-on-failure
      
      - name: Install cminpack
        run: cmake --install ${{ env.CMINPACK_BUILD_DIR }} --config ${{ matrix.CMAKE_BUILD_TYPE }}
      
      - name: Build and run a program with the installed pkg-config file
        if: ${{ matrix.USE_LAPACK == 'ON' }}
        run: |
          export PKG_CONFIG_PATH=${{ env.CMINPACK_INSTALL_DIR }}/lib/pkgconfig
          cc cminpack/examples/tlmderc.c $(pkg-config --cflags --libs cminpack) -o tlmderc
          LD_LIBRARY_PATH=${{ env.CMINPACK_INSTALL_DIR }}/lib ./tlmderc
      
      - name: Delete checkout directory
        run: rm -rf $RUNNER_TEMP/cminpack
      
      - name: Delete build directory
        run: rm -rf ${{ env.CMINPACK_BUILD_DIR }}
      
      - name: Delete install directory
        run: rm -rf ${{ env.CMINPACK_INSTALL_DIR }}
